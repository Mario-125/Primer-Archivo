<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda página</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            box-sizing: border-box;
            background-color: #d9f2d0;
            color: #23402b;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 12px 0 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, auto);
            gap: 24px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .box {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            border: 4px solid white;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 14px rgb(35 64 43 / 18%);
        }

        .photo {
            display: block;
            width: 100%;
            max-height: 220px;
            margin-top: 12px;
            object-fit: contain;
            border: 4px solid white;
            border-radius: 14px;
            box-sizing: border-box;
            box-shadow: 0 4px 14px rgb(35 64 43 / 18%);
        }

        .box video {
            width: 100%;
            max-height: 220px;
            border-radius: 8px;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 11px 16px;
            border-radius: 8px;
            background: #347a43;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .button:hover,
        .button:focus {
            background: #245c31;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>¡Esta es la segunda página!</h1>

        <section class="grid">
            <article class="card">
                <h2>Código del LED</h2>
                <div class="box">
                    <p>Aquí puedes escribir el contenido del primer recuadro.</p>
                </div>
                <img class="photo" src="capturaled.jpg" alt="Captura del código de un LED">
            </article>

            <article class="card">
                <h2>Codigo del potenciometro</h2>
                <div class="box">
                    <video controls>
                        <source src="video.mp4" type="video/mp4">
                        Tu navegador no puede reproducir este vídeo.
                    </video>
                </div>
            </article>

            <article class="card">
                <h2>Tercer recuadro</h2>
                <div class="box">
                    <p>Aquí puedes escribir el tercer texto.</p>
                </div>
            </article>

            <article class="card">
                <h2>Cuarto recuadro</h2>
                <div class="box">
                    <p>Aquí puedes escribir el cuarto texto.</p>
                </div>
            </article>
        </section>

        <a class="button" href="index.html">⬅️ Volver</a>
    </main>
</body>
</html>
