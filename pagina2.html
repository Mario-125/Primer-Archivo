<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Segunda página de mi sitio web">
    <title>Segunda página</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            background-color: #d9f2d0;
            color: #23402b;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin: 12px 0; }
        p { line-height: 1.6; }
        img {
            display: block;
            width: min(100%, 600px);
            height: auto;
            margin: 24px auto;
            border: 4px solid white;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgb(35 64 43 / 18%);
        }
        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 11px 16px;
            border-radius: 8px;
            background: #347a43;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .button:hover, .button:focus { background: #245c31; }
    </style>
</head>
<body>
    <main>
        <h1>¡Esta es la segunda página!</h1>
        <p>Bienvenido a la segunda parte de mi sitio web.</p>
        <img src="https://raw.githubusercontent.com/Mario-125/Primer-Archivo/main/pato.jpg" alt="Un pato">
        <a class="button" href="index.html">⬅️ Volver</a>
    </main>
</body>
</html>
